<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 
    Joystick Icon - Modern, Minimalist, Tech
    Colors: Cyan (#66FCF1) & Dark (#1F2833) match the theme
  -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66FCF1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45A29E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <rect x="106" y="300" width="300" height="160" rx="40" ry="40" fill="#1F2833" stroke="url(#grad1)" stroke-width="20" />
  
  <!-- Stick Base -->
  <circle cx="256" cy="300" r="60" fill="#0B0C10" stroke="#45A29E" stroke-width="5" />
  
  <!-- Stick Shaft -->
  <rect x="236" y="180" width="40" height="120" fill="#45A29E" />
  
  <!-- Stick Top (Ball) -->
  <circle cx="256" cy="180" r="70" fill="url(#grad1)" />
  
  <!-- Buttons (Right) -->
  <circle cx="350" cy="360" r="15" fill="#C5C6C7" />
  <circle cx="350" cy="400" r="15" fill="#C5C6C7" />
  
  <!-- Highlight on Ball -->
  <ellipse cx="236" cy="160" rx="20" ry="10" fill="rgba(255,255,255,0.4)" transform="rotate(-45 236 160)" />
</svg>
